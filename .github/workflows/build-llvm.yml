name: Build LLVM

on:
  push:
    branches: ['release/*']
  pull_request:
    branches: ['release/*']
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub release'
        required: false
        default: 'false'
        type: boolean

env:
  LLVM_VERSION: '21'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # LTO builds
          - os: linux
            runs_on: ubuntu-latest
            container: ghcr.io/wavm/builder-linux-x64:latest
            config: LTO
            artifact_suffix: linux-x64
            extra_args: '--test'
          - os: macos
            runs_on: macos-latest
            config: LTO
            artifact_suffix: macos-arm64
            extra_args: '--test'
          - os: windows
            runs_on: windows-latest
            config: LTO
            artifact_suffix: windows-x64
            extra_args: '--test'
          # Linux non-LTO
          - os: linux
            runs_on: ubuntu-latest
            container: ghcr.io/wavm/builder-linux-x64:latest
            config: RelWithDebInfo
            artifact_suffix: linux-x64
          - os: linux
            runs_on: ubuntu-latest
            container: ghcr.io/wavm/builder-linux-x64:latest
            config: Debug
            artifact_suffix: linux-x64
          - os: linux
            runs_on: ubuntu-latest
            container: ghcr.io/wavm/builder-linux-x64:latest
            config: Checked
            artifact_suffix: linux-x64
          - os: linux
            runs_on: ubuntu-latest
            container: ghcr.io/wavm/builder-linux-x64:latest
            config: Sanitized
            artifact_suffix: linux-x64
          # Windows non-LTO
          - os: windows
            runs_on: windows-latest
            config: RelWithDebInfo
            artifact_suffix: windows-x64
          - os: windows
            runs_on: windows-latest
            config: Debug
            artifact_suffix: windows-x64
          - os: windows
            runs_on: windows-latest
            config: Checked
            artifact_suffix: windows-x64
          # macOS non-LTO
          - os: macos
            runs_on: macos-latest
            config: RelWithDebInfo
            artifact_suffix: macos-arm64
          - os: macos
            runs_on: macos-latest
            config: Debug
            artifact_suffix: macos-arm64
          - os: macos
            runs_on: macos-latest
            config: Checked
            artifact_suffix: macos-arm64
          - os: macos
            runs_on: macos-latest
            config: Sanitized
            artifact_suffix: macos-arm64
    runs-on: ${{ matrix.runs_on }}
    container: ${{ matrix.container || null }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja (macOS)
        if: matrix.os == 'macos'
        run: brew install ninja

      - name: Setup MSVC
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build LLVM
        run: python3 build-llvm.py --config ${{ matrix.config }} --platform ${{ matrix.os }} --work-dir . --install-dir ./install ${{ matrix.extra_args }}

      - name: Create archive (Unix)
        if: matrix.os != 'windows'
        run: |
          cd install
          tar -cJf ../llvm-${{ env.LLVM_VERSION }}-${{ matrix.artifact_suffix }}-${{ matrix.config }}.tar.xz .

      - name: Create archive (Windows)
        if: matrix.os == 'windows'
        run: |
          cd install
          7z a -tzip ../llvm-${{ env.LLVM_VERSION }}-${{ matrix.artifact_suffix }}-${{ matrix.config }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-${{ env.LLVM_VERSION }}-${{ matrix.artifact_suffix }}-${{ matrix.config }}
          path: llvm-${{ env.LLVM_VERSION }}-${{ matrix.artifact_suffix }}-${{ matrix.config }}.${{ matrix.os == 'windows' && 'zip' || 'tar.xz' }}
          retention-days: 7

  # Create GitHub release
  release:
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get release tag
        id: tag
        run: |
          LLVM_COMMIT=$(cat LLVM_COMMIT)
          echo "tag=${LLVM_COMMIT:0:12}" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: LLVM ${{ env.LLVM_VERSION }} (${{ steps.tag.outputs.tag }})
          draft: false
          prerelease: false
          files: artifacts/**/*
