name: Build LLVM

on:
  push:
    branches: ['release/*']
  pull_request:
    branches: ['release/*']
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub release'
        required: false
        default: 'false'
        type: boolean

env:
  LLVM_VERSION: '21'
  WORK_DIR: '.'

jobs:
  # LTO Stage 1: Build bootstrap toolchain
  lto-stage1:
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macos, windows]
        include:
          - os: linux
            runs_on: ubuntu-latest
            container: ghcr.io/wavm/builder-linux-x64:latest
            artifact_suffix: linux-x64
          - os: macos
            runs_on: macos-latest
            artifact_suffix: macos-arm64
          - os: windows
            runs_on: windows-latest
            artifact_suffix: windows-x64
    runs-on: ${{ matrix.runs_on }}
    container: ${{ matrix.container || null }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build LTO Stage 1
        run: python3 build-llvm.py --config LTO-stage1 --platform ${{ matrix.os }} --work-dir ${{ env.WORK_DIR }}

      - name: Upload stage 1 install
        uses: actions/upload-artifact@v4
        with:
          name: lto-stage1-${{ matrix.artifact_suffix }}
          path: ${{ env.WORK_DIR }}/install-LTO-stage1/
          include-hidden-files: true
          retention-days: 1

  # LTO Stage 2: Build with LTO using stage 1 toolchain
  lto-stage2:
    needs: lto-stage1
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macos, windows]
        include:
          - os: linux
            runs_on: ubuntu-latest
            container: ghcr.io/wavm/builder-linux-x64:latest
            artifact_suffix: linux-x64
            archive_ext: tar.xz
            archive_cmd: 'tar -cJf'
          - os: macos
            runs_on: macos-latest
            artifact_suffix: macos-arm64
            archive_ext: tar.xz
            archive_cmd: 'tar -cJf'
          - os: windows
            runs_on: windows-latest
            artifact_suffix: windows-x64
            archive_ext: zip
            archive_cmd: '7z a -tzip'
    runs-on: ${{ matrix.runs_on }}
    container: ${{ matrix.container || null }}
    steps:
      - uses: actions/checkout@v4

      - name: Download stage 1 install
        uses: actions/download-artifact@v4
        with:
          name: lto-stage1-${{ matrix.artifact_suffix }}
          path: ${{ env.WORK_DIR }}/install-LTO-stage1/

      - name: Restore execute permissions
        if: matrix.os != 'windows'
        run: chmod +x ${{ env.WORK_DIR }}/install-LTO-stage1/bin/*

      - name: Setup MSVC
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build LTO Stage 2
        run: python3 build-llvm.py --config LTO --platform ${{ matrix.os }} --work-dir ${{ env.WORK_DIR }} --install-dir ${{ env.WORK_DIR }}/install --test

      - name: Create archive
        run: |
          cd ${{ env.WORK_DIR }}/install
          ${{ matrix.archive_cmd }} ../llvm-${{ env.LLVM_VERSION }}-${{ matrix.artifact_suffix }}-LTO.${{ matrix.archive_ext }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-${{ env.LLVM_VERSION }}-${{ matrix.artifact_suffix }}-LTO
          path: ${{ env.WORK_DIR }}/llvm-${{ env.LLVM_VERSION }}-${{ matrix.artifact_suffix }}-LTO.${{ matrix.archive_ext }}
          include-hidden-files: true
          retention-days: 7

  # Non-LTO builds
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macos, windows]
        config: [Debug, RelWithDebInfo, Checked, Sanitized]
        exclude:
          - os: windows
            config: Sanitized
        include:
          - os: linux
            runs_on: ubuntu-latest
            container: ghcr.io/wavm/builder-linux-x64:latest
            artifact_suffix: linux-x64
            archive_ext: tar.xz
            archive_cmd: 'tar -cJf'
          - os: macos
            runs_on: macos-latest
            artifact_suffix: macos-arm64
            archive_ext: tar.xz
            archive_cmd: 'tar -cJf'
          - os: windows
            runs_on: windows-latest
            artifact_suffix: windows-x64
            archive_ext: zip
            archive_cmd: '7z a -tzip'
    runs-on: ${{ matrix.runs_on }}
    container: ${{ matrix.container || null }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build LLVM
        run: python3 build-llvm.py --config ${{ matrix.config }} --platform ${{ matrix.os }} --work-dir ${{ env.WORK_DIR }} --install-dir ${{ env.WORK_DIR }}/install

      - name: Create archive
        run: |
          cd ${{ env.WORK_DIR }}/install
          ${{ matrix.archive_cmd }} ../llvm-${{ env.LLVM_VERSION }}-${{ matrix.artifact_suffix }}-${{ matrix.config }}.${{ matrix.archive_ext }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-${{ env.LLVM_VERSION }}-${{ matrix.artifact_suffix }}-${{ matrix.config }}
          path: ${{ env.WORK_DIR }}/llvm-${{ env.LLVM_VERSION }}-${{ matrix.artifact_suffix }}-${{ matrix.config }}.${{ matrix.archive_ext }}
          include-hidden-files: true
          retention-days: 7

  # Create GitHub release
  release:
    needs: [lto-stage2, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: llvm-*

      - name: Get release tag
        id: tag
        run: |
          LLVM_COMMIT=$(cat LLVM_COMMIT)
          echo "tag=${LLVM_COMMIT:0:12}" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: LLVM ${{ env.LLVM_VERSION }} (${{ steps.tag.outputs.tag }})
          draft: false
          prerelease: false
          files: artifacts/**/*
